<title>贴进相册</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Long+Cang&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@500&family=Caveat:wght@600&family=Special+Elite&display=swap">
<style>
/* 暗房：炭灰底，让白色的拍立得成为画面里最亮的东西；只有一个暖琥珀色当强调（像暗房安全灯）。不歪、不贴硬阴影，界面字用干净的无衬线。 */
:root{
  --bg:#1A1918;--surface:#232220;--surface2:#2D2B28;--line:#393632;--text:#F1EDE6;--muted:#A29C92;--faint:#6E6961;
  --accent:#F2B544;--accent-ink:#1A1918;--danger:#FF7A6B;
  /* 旧名字留着给零星的内联样式用 */
  --paper:#F1EDE6;--blue:#F2B544;--deep:#1A1918;--tape:#F2B544;--ink:#1A1918;--soft:#A29C92;--pink:#FF8FB1;
  --ui:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --round:"Zen Maru Gothic","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --hand:"Long Cang","Kaiti SC","STKaiti",cursive;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 通用按钮 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-size:13px}
.grp{display:flex;gap:6px}
.chip{background:var(--surface2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--text);transition:background .15s,color .15s}
.chip:hover{background:#38352F}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip:disabled{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.big{margin:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));height:50px;border-radius:12px;font-weight:700;font-size:16px;letter-spacing:.02em}
.big.yellow{background:var(--accent);color:var(--accent-ink)}
.big.yellow:hover{filter:brightness(1.06)}

/* 扫描 */
.desk{flex:1;min-height:0;margin:12px max(12px,env(safe-area-inset-left,0px)) 0;border-radius:14px;background:#121110;position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1px var(--line)}
.desk canvas{position:absolute;left:0;top:0}
.desk svg{position:absolute;inset:0;width:100%;height:100%}
.handle{fill:var(--text);stroke:var(--accent);stroke-width:3;cursor:grab}
.bubble,.bubble2{position:absolute;max-width:72%;background:rgba(26,25,24,.88);color:var(--text);font-weight:600;font-size:12px;border-radius:8px;padding:6px 10px;pointer-events:none;backdrop-filter:blur(6px);line-height:1.5}
.bubble{right:10px;top:10px}.bubble2{left:10px;bottom:10px;color:var(--accent)}
.formats{display:flex;gap:6px;padding-top:12px;flex-wrap:wrap}
.formats .chip{font-size:12px;padding:6px 10px}
.glaretip{font-size:12px;color:var(--muted);line-height:1.7;padding-top:10px;margin:0}
.glaretip b{color:var(--accent);margin-right:6px;font-weight:700}
.tray{display:flex;gap:8px;padding-top:12px;align-items:center;min-height:72px;overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray .t{flex:0 0 auto;border-radius:6px;overflow:hidden;cursor:pointer;line-height:0;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.tray .t canvas{width:44px;height:56px;object-fit:cover;display:block}
.tray .t.cur{box-shadow:0 0 0 2px var(--accent)}
.tray .add{flex:0 0 44px;height:56px;border:1.5px dashed var(--faint);border-radius:6px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.tray small{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;align-self:center}
.camrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;font-size:13px;color:var(--muted)}
.camrow .chip{background:var(--surface2);color:var(--text)}
.camrow #td3d{background:transparent!important;color:var(--muted)!important;box-shadow:inset 0 0 0 1px var(--line)}

/* 调色：卡片 */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:14px 0 4px;background:radial-gradient(ellipse at 50% 45%,#2A2826 0%,var(--bg) 70%)}
.card{position:relative;line-height:0;box-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65)}
.card canvas{display:block;width:100%;height:100%}
/* 翻面：卡片绕竖轴转到侧面，换成另一面再转回来 */
.card{transition:transform .17s ease-in}.card.turn{transform:perspective(900px) rotateY(90deg)}
.card.backside .cap,.card.backside .sticker{display:none}
.tape{display:none}
.cap{position:absolute;left:6%;right:6%;white-space:nowrap;overflow:hidden;line-height:1.1;outline:none;font-family:var(--hand);color:#2747D6;text-align:left}
.cap.round{font-family:var(--round);font-weight:900}
.sticker{position:absolute;border-radius:50%;background:var(--pink);color:#10153A;font-weight:900;display:grid;place-items:center;text-align:center;line-height:1.05;touch-action:none;cursor:grab;transform:translate(-50%,-50%) rotate(12deg);box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:var(--round)}
.card.brush canvas{cursor:crosshair;touch-action:none}
.peek{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(26,25,24,.9);color:var(--text);font-size:12px;font-weight:600;border-radius:8px;padding:5px 10px;pointer-events:none}
.note{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:10px;z-index:3;max-width:62%;background:rgba(45,43,40,.92);color:var(--text);font-weight:600;font-size:12px;line-height:1.45;border-radius:10px;padding:7px 11px 7px 26px;text-align:left;backdrop-filter:blur(6px)}
.note::before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent)}
.note:hover{background:rgba(56,53,47,.95)}
.gbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;display:flex;gap:6px;align-items:center;background:rgba(26,25,24,.94);border-radius:12px;padding:6px 6px 6px 12px;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 0 0 1px var(--line);white-space:nowrap}
.gbar b{font-size:12px;font-weight:700;color:var(--accent)}
.gbar .chip{padding:5px 10px;font-size:12px}
.gbar .gx{width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:16px;line-height:1}

/* 调色：控件 */
.side{display:contents}
/* 手机上长表单在侧栏内滚动，避免挤压照片并挡住顶部操作。 */
@media (max-width:899px){
  #editView>.top{flex:0 0 auto;position:relative;z-index:5;flex-wrap:wrap}
  #editView>.stage{min-height:100px;overflow:hidden}
  #editView>.side{display:flex;flex-direction:column;flex:0 1 auto;min-height:0;max-height:55%;overflow-y:auto}
  #editView>.side>.pad:first-child{position:sticky;top:0;z-index:2;background:var(--bg);flex:0 0 auto}
  #editView>.side>.savebar{position:sticky;bottom:0;z-index:2;flex:0 0 auto;background:var(--bg)}
}
.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0 9px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tp:not(.on){display:none!important}
.fl{display:flex;gap:10px;overflow-x:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.fl::-webkit-scrollbar{display:none}
.fl button{flex:0 0 58px;text-align:center;font-weight:500;font-size:12px;line-height:1.4;color:var(--muted)}
.fl canvas{width:58px;height:58px;display:block;border-radius:8px;margin-bottom:5px;object-fit:cover;background:var(--surface2);box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.fl button:hover canvas{box-shadow:0 0 0 1px var(--faint)}
.fl button.on{color:var(--text);font-weight:600}.fl button.on canvas{box-shadow:0 0 0 2px var(--accent)}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;padding-top:12px}
.sliders.tp{padding-top:16px;row-gap:16px}
.sl{display:grid;grid-template-columns:32px 1fr 26px;align-items:center;font-weight:500;font-size:12px;color:var(--muted)}
.sl output{font-size:12px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:24px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text)}
.slx{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.slx .chip{padding:6px 10px;font-size:12px}
.bsz{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.bsz input{width:80px}
.frames{padding-top:14px}
.frtop{display:flex;gap:6px;align-items:center;font-size:12px}
.frtop b{font-weight:600;font-size:12px;color:var(--muted);margin-right:4px}
.frames .chip{padding:6px 10px;font-size:12px}
.frames .push{margin-left:auto}
.fr{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin;align-items:flex-start}
.fr .sw{flex:0 0 54px;font-weight:500;font-size:11px;line-height:1.3;text-align:center;color:var(--muted);white-space:nowrap}
.fr .sw canvas{width:40px;display:block;margin:0 auto 4px;border-radius:2px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.fr .sw:hover canvas{box-shadow:0 0 0 1px var(--faint)}
.fr .sw.on{color:var(--text);font-weight:600}.fr .sw.on canvas{box-shadow:0 0 0 2px var(--accent)}
.fr .grp{flex:0 0 auto;writing-mode:vertical-rl;font-size:11px;font-weight:600;color:var(--faint);padding:2px 0 2px 6px;border-left:1px solid var(--line);letter-spacing:.05em}
@media (min-width:900px){.fr{flex-wrap:wrap;overflow:visible;row-gap:12px;column-gap:6px}.fr .grp{writing-mode:horizontal-tb;flex-basis:100%;border:0;padding:8px 0 0;color:var(--muted)}}
.fontrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:14px;font-size:12px}
.fontrow b{font-weight:600;font-size:12px;color:var(--muted);flex:0 0 auto;margin-right:2px}
.fontrow .chip{padding:6px 10px;font-size:12px;flex:0 0 auto}
.fontrow .fl2{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;padding-top:6px}
.fontrow .fl2 .chip{font-size:15px;padding:5px 12px;line-height:1.3;font-weight:inherit}
.daterow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:14px;font-size:12px}
.daterow b{font-weight:600;font-size:12px;color:var(--muted);margin-right:2px}
.daterow .chip{padding:6px 10px;font-size:12px}
.daterow input[type=date]{background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:6px 10px;font:500 12px var(--ui);color-scheme:dark}
.daterow .sep{width:1px;height:16px;background:var(--line)}
.savebar{display:flex;gap:8px;align-items:center;margin:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.savebar .big{margin:0;flex:1;background:var(--accent);color:var(--accent-ink)}
.savebar .big:hover{filter:brightness(1.06)}
.savebar .sm{flex:0 0 auto;height:50px;padding:0 16px;border-radius:12px;background:var(--surface2);color:var(--text);font-weight:600;font-size:13px}

/* 浮层 */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:rgba(17,16,15,.95);color:var(--text);font-weight:500;font-size:13px;border-radius:10px;padding:10px 14px;max-width:86%;text-align:center;z-index:35;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
.sheet{position:absolute;inset:0;background:rgba(10,10,9,.94);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet img{max-width:100%;max-height:70%;box-shadow:0 20px 50px rgba(0,0,0,.6);-webkit-touch-callout:default}
.sheet p{font-size:14px;text-align:center;line-height:1.6;color:var(--muted)}
.sheet .chip{font-size:14px;padding:9px 20px}
.sheet .grp{gap:8px}.sheet a.chip{text-decoration:none}
/* 拖角时的放大镜 */
.loupe{position:absolute;width:128px;height:128px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--accent),0 10px 28px rgba(0,0,0,.55);background:#121110}
/* 回忆 */
.memo{display:grid;gap:12px;padding-top:14px;font-size:12px}
.memo label{display:grid;gap:5px;color:var(--muted);font-weight:600}
.memo input,.memo textarea{width:100%;background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:8px 10px;font:500 13px var(--ui);color-scheme:dark}
.memo input:disabled{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.memo textarea{min-height:66px;resize:vertical;line-height:1.6}
.memo .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.memo .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-weight:600}
.memo .chip{padding:6px 10px;font-size:12px}
.mh{font-weight:400;color:var(--faint);line-height:1.6;margin:0}
/* 导出 */
.exp{position:absolute;inset:0;z-index:28;background:rgba(10,10,9,.72);display:flex;align-items:flex-end;justify-content:center}
.exp .box{width:100%;max-width:440px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 1px 0 var(--line)}
@media (min-width:900px){.exp{align-items:center}.exp .box{border-radius:16px}}
.exp h2{font-size:16px;font-weight:700;margin:0 0 8px}
.exp .opt{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.exp .opt div{display:flex;flex-wrap:wrap;gap:6px}
.exp .chip{font-size:12px;padding:6px 10px}
.exp .acts{display:flex;gap:8px;margin-top:12px}
.exp .acts .big{margin:0;flex:1;background:var(--accent);color:var(--accent-ink)}
.exp .acts .big:disabled{opacity:.6}
.exp .acts .sm{height:50px;padding:0 16px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:13px}
.exp .draft{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.exp .draft span{flex-basis:100%}
.exp .draft .chip{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.exp .draft .chip.warn{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
/* 相册页 */
.album .body{display:flex;flex-direction:column;gap:12px}
.album .body>*{flex-shrink:0}   /* 横向滚动的行不许被压扁 */
.album .tpl{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}
.album .ttl{background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:9px 12px;font:500 13px var(--ui)}
.album .sub{margin:0}.album .sub b{color:var(--text)}
.album .picks{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:thin}
.album .picks button{flex:0 0 auto;line-height:0;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);opacity:.4;transition:opacity .15s}
.album .picks button.on{opacity:1;box-shadow:0 0 0 2px var(--accent)}
.album .picks canvas{width:44px;height:56px;display:block}
.album .pv{width:100%;height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--surface)}
.album .pages{display:flex;gap:6px;overflow-x:auto;padding-top:12px;align-items:center;font-size:12px;color:var(--muted);font-weight:600;scrollbar-width:none}
.album .pages>span{flex:none;margin-right:2px}
.album .pages .chip{flex:none;font-size:12px;padding:6px 10px}
.album .ord{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.album .ord>span{flex-basis:100%}
.album .ord .it{line-height:0;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px var(--accent);touch-action:none;cursor:grab;position:relative}
.album .ord .it canvas{width:44px;height:56px;display:block}
.album .ord .it b{position:absolute;left:3px;top:3px;line-height:1;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:2px 4px}
.album .ord .it.drag{opacity:.45;cursor:grabbing}
.album .ord.fixed .it{cursor:default;touch-action:auto}
.album .look{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--muted);font-weight:600}
.album .look>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.album .look .chip{font-size:12px;padding:5px 10px}
.album .bgsw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.album .bgsw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.album .top .chip.warn,.lib .chip.warn,.memo .chip.warn{color:var(--danger);background:transparent;box-shadow:inset 0 0 0 1px var(--danger)}
/* 背面、放进相册 */
.memo .bk{display:flex;gap:12px;align-items:flex-start}
.memo .bk canvas{width:54px;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--line);flex:none;cursor:pointer}
.memo .bk>div{display:grid;gap:6px}.memo .bk b{color:var(--text)}
.memo .newcol{width:8em;padding:5px 8px;font-size:12px}
.memo select{width:100%;background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:8px 6px;font:500 13px var(--ui);color-scheme:dark}
.memo .dsel{display:flex;gap:6px}.memo .dsel>*{min-width:0;flex:1}
/* 我的相册：分类、搜索、翻面 */
.lib .q{width:100%;margin-top:12px;background:var(--surface2);color:var(--text);border:0;border-radius:10px;padding:10px 12px;font:500 14px var(--ui)}
.lib .tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.lib .tags .chip{font-size:12px;padding:5px 10px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.lib .tags .chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}

function solveH(src, dst){ // 求把 src 四点映到 dst 四点的单应矩阵
  const A=[];
  for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]); A.push([0,0,0,x,y,1,-v*x,-v*y,v]);}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k];}}
  return [0,1,2,3,4,5,6,7].map(i=>A[i][8]/A[i][i]);
}
function warp(src, quad, W, H){ // 把 src 上的四边形拉成 W×H 的矩形

  const out=new ImageData(W,H), od=out.data;
  for(let y=0;y<H;y++){const yy=y+.5;
    for(let x=0;x<W;x++){const xx=x+.5, d=h[6]*xx+h[7]*yy+1;
      let sx=(h[0]*xx+h[1]*yy+h[2])/d-.5, sy=(h[3]*xx+h[4]*yy+h[5])/d-.5;
      sx=Math.max(0,Math.min(sw-1.001,sx)); sy=Math.max(0,Math.min(sh-1.001,sy));
      const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,i0=(y0*sw+x0)*4,i1=i0+sw*4,o=(y*W+x)*4;
      for(let c=0;c<3;c++){const a=sd[i0+c]+(sd[i0+4+c]-sd[i0+c])*fx, b=sd[i1+c]+(sd[i1+4+c]-sd[i1+c])*fx; od[o+c]=a+(b-a)*fy;}

  const lo=[],up=[];
  for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}

/* ---------- 自动找边框：从画面四边向里长出「桌面」，剩下最大的一块就是拍立得 ---------- */
function detect(img){

  const dN=(p,q)=>Math.abs(d[p*4]-d[q*4])+Math.abs(d[p*4+1]-d[q*4+1])+Math.abs(d[p*4+2]-d[q*4+2]);

  while(qh<qt){const p=Q[qh++],px=p%w;
    for(const q of [p-w,p+w,px>0?p-1:-1,px<w-1?p+1:-1]){if(q<0||q>=n||bg[q])continue;

    while(qh<qt){const p=Q[qh++],px=p%w;cnt++;
      for(const q of [p-w,p+w,px>0?p-1:-1,px<w-1?p+1:-1]){if(q<0||q>=n||bg[q]||lab[q])continue;lab[q]=cur;Q[qt++]=q}}
    if(cnt>bestN){bestN=cnt;best=cur}}

  const pts=[];
  for(let p=0;p<n;p++){if(lab[p]!==best)continue;const px=p%w;
    if(px===0||px===w-1||p<w||p>=n-w||lab[p-1]!==best||lab[p+1]!==best||lab[p-w]!==best||lab[p+w]!==best)pts.push([px+.5,(p/w|0)+.5])}

    const ext=[[1,1],[1,-1],[-1,-1],[-1,1]].map(([su,sv])=>{let bp=null,bv=-Infinity;

    const q=orderQuad(ext),ar=area(q);if(ar>ba){ba=ar;bq=q}}
  if(!bq||ba<bestN*.6)return null;
  return bq.map(p=>[p[0]/S,p[1]/S]);
}

/* 电脑上常一次拖进好几张：能认出边框的直接拉正，认不出的留到最后手动框 */
async function loadFiles(list){

  if(files.length>1)backFor=mergeFor=-1;   // 背面、补拍都只要一张
  if(files.length===1){await loadFile(files[0]).catch(()=>toast('这张图打不开，换一张试试'));return}
  toast(`正在处理 ${files.length} 张…`,60000);

  for(const f of files){
    let bmp;try{bmp=await decodeFile(f);bmp._date=await fileDate(f);bmp._file=f}catch(e){bad++;continue}

  else if(ok){openEdit(scans.length-1);toast(`${ok} 张都拉正了${tail}，${innerWidth>=900?'点右边的小图切换着调':'点「‹ 重扫」能看到全部，点小图切换'}`,4200)}

// 把四个角框住的相纸拉成 W×H 的整张；原比例时只拉正照片，再放进补出来的白边里

/* ---------- 反光 ----------
   拍立得是亮面的，翻拍几乎都会反光。三招：
   1. 换个角度补拍一张：两张都按白边拉正到同一尺寸，反光会挪位置，第一张反光的地方用第二张补上（Google PhotoScan 也是这个思路）
   2. 自动修小光斑：用周围的颜色一圈圈往里填

// 每个像素「像反光」的程度 0–1：很亮、几乎没颜色。再模糊一下，补的时候不留硬边

  for(let i=0,j=0;j<W*H;i+=4,j++){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);

// 涂掉光斑：用户涂过的地方（st.spots，每笔是照片里的 [横, 竖, 半径]，按照片宽度归一），从外往里一圈圈用周围颜色填上，再抹平

$('libCols').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;lib.col=b.dataset.col;lib.pick=false;renderLib()};
$('libCols').addEventListener('keydown',e=>{if(e.target.id!=='libNew'||e.key!=='Enter'||e.isComposing)return;e.preventDefault();const c=newCol(e.target.value);if(c){lib.col=c.id;lib.pick=true;renderLib();toast(`建好了「${c.name}」，点照片把它们放进来`)}});
$('libBar').addEventListener('change',e=>{const c=colOf(lib.col);if(e.target.id!=='colName'||!c)return;const v=e.target.value.trim().slice(0,12);if(v){c.name=v;draftSoon()}renderLibHead()});
$('libBar').onclick=e=>{const c=colOf(lib.col),b=e.target.closest('button');if(!c||!b)return;
  if(b.id==='colPick'){lib.pick=!lib.pick;renderLib()}
  else if(b.id==='colDel')sure(b,`确定删掉「${c.name}」？照片不会删`,()=>{cols=cols.filter(k=>k!==c);lib.col='all';lib.pick=false;draftSoon();renderLib();toast('相册删掉了，照片还在')})};
$('libGrid').onclick=e=>{const f=e.target.closest('.lc');if(!f)return;const s=scans.find(x=>x.id===f.dataset.id);if(!s)return;const c=colOf(lib.col),op=e.target.closest('[data-op]')?.dataset.op;
  if(lib.pick&&c){const i=c.ids.indexOf(s.id);if(i>=0)c.ids.splice(i,1);else c.ids.push(s.id);f.classList.toggle('sel',i<0);f.classList.toggle('unsel',i>=0);draftSoon();renderLibHead();return}
  if(op==='open'||(!op&&e.target.closest('.flip')&&!s.back)){$('libPanel').hidden=true;openEdit(scans.indexOf(s));return}
  if(op==='cover'){c.cover=s.id;draftSoon();renderLib();return}
  if(op==='flip'||e.target.closest('.flip'))f.classList.toggle('turned')};
$('libGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('flip')){e.preventDefault();e.target.click()}});
$('libAlbum').onclick=()=>{if(lib.pick){lib.pick=false;renderLib();return}const c=colOf(lib.col),l=libList().reverse();if(!l.length){toast('这里还没有照片');return}
  $('libPanel').hidden=true;openAlbum(l.map(s=>s.id),c?c.name:lib.q.trim())};

  const o=td.orb,c=td.C,rr=o.r*(1+((td.exK||1)*(c.aspect<1?1.1:1)-1)*td.gEx);if(td.exC)o.target.lerpVectors(td.homeC,td.exC,td.gEx);
  c.position.set(o.target.x+rr*Math.sin(o.phi)*Math.sin(o.theta),o.target.y+rr*Math.cos(o.phi),o.target.z+rr*Math.sin(o.phi)*Math.cos(o.theta));c.lookAt(o.target);
  const L=td.light;td.hemi.intensity=1.1*L;td.key.intensity=2.2*L;td.rim.intensity=1.2*L;td.fill.intensity=30*L;
  const tags=$('tdLabels').children,r=$('tdCv').getBoundingClientRect(),v=new T.Vector3(),pend=[];
  td.parts.forEach((p,i)=>{p.t+=(p.target-p.t)*Math.min(1,dt*7);const e=Math.max(p.t,exEase(p,td.gEx));
    p.obj.position.copy(p.home).addScaledVector(p.dir,e);
    const glow=p===td.sel?.55+.35*Math.sin(now*5):0;
    // 只在发光值变了的时候写材质：平时每帧只有选中的那一件在闪
    if(glow!==p.glow){p.glow=glow;p.obj.traverse(m=>{if(!m.isMesh)return;if(!tdV.has(m))tdV.set(m,{e:m.material.emissive.getHex(),ei:m.material.emissiveIntensity});const b=tdV.get(m);
      if(glow>0){m.material.emissive.setHex(0x22B8F0);m.material.emissiveIntensity=glow}else{m.material.emissive.setHex(b.e);m.material.emissiveIntensity=b.ei}})}
    const tag=tags[i];if(!tag)return;const show=p===td.sel||(td.tagsOn&&e>.6);tag.classList.toggle('mini',p!==td.sel&&p.t<.6);
    let st=tagMeta.get(tag);if(!st){st={x:0,y:0,slot:0,cls:'',w:0,h:0,init:false};tagMeta.set(tag,st)}
    if(!show){tag.hidden=true;st.init=false;return}
    p.obj.getWorldPosition(v);v.y+=.8;v.project(c);const x=(v.x+1)/2*r.width,y=(1-v.y)/2*r.height;
    if(v.z>1||x<-20||x>r.width+20||y<-20||y>r.height+20){tag.hidden=true;st.init=false;return}
    tag.hidden=false;tag.classList.toggle('sel',p===td.sel);
    if(st.cls!==tag.className||!st.w){st.w=tag.offsetWidth||56;st.h=tag.offsetHeight||22;st.cls=tag.className}
    pend.push({tag,x,y,i,st});
  });
  // 标签避让：锚点从上到下摆放，在候选位里挑代价最小的空位（重叠面积优先、再看出界和位移），避免压字/飞出画布
  pend.sort((a,b)=>a.y-b.y||a.x-b.x);
  const placed=[],obst=[],inter=(a,b)=>{const w=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),h=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);return w>0&&h>0?w*h:0};
  for(const id of ['tdInfo','tdHint']){const el=$(id);if(!el||el.hidden)continue;const b=el.getBoundingClientRect();
    if(b.width>4&&b.height>4)obst.push({x:b.left-r.left,y:b.top-r.top,w:b.width,h:b.height})}
  const smooth=1-Math.exp(-dt*40);
  pend.forEach(t=>{
    const {tag,st}=t,w=st.w,h=st.h,step=h+5,tx=t.x-w/2,ty=t.y-h;
    const cand=[[0,0],[0,step],[0,-step],[step,0],[-step,0],[0,step*2],[0,-step*2],[step,step],[-step,step],[step,-step],[-step,-step],
      [w*.9,0],[-w*.9,0],[0,step*3],[0,-step*3],[w*.9,step],[-w*.9,step],[w*.9,-step],[-w*.9,-step],[0,step*4],[0,-step*4],[0,step*5],[0,-step*5],[w*1.5,0],[-w*1.5,0]];
    let best=null,bestCost=1/0,bestIdx=0;
    for(let k=0;k<cand.length;k++){const [dx,dy]=cand[k],b={x:tx+dx,y:ty+dy,w,h};
      const out=Math.max(0,4-b.x)+Math.max(0,4-b.y)+Math.max(0,b.x+w-r.width+4)+Math.max(0,b.y+h-r.height+4);
      let ov=0;placed.forEach(q=>ov+=inter(b,q));obst.forEach(q=>ov+=inter(b,q));
      // 迟滞：换到别的槽位要付 60 的代价，避免旋转时在候选位之间来回跳
      const cost=ov*40+out*40+Math.abs(dx)+Math.abs(dy)+(k===st.slot?0:22);
      if(cost<bestCost){bestCost=cost;best=b;bestIdx=k}}
    const bx=Math.max(4,Math.min(r.width-w-4,best.x)),by=Math.max(4,Math.min(r.height-h-4,best.y));
    const box={x:bx,y:by,w,h};placed.push({x:bx-2,y:by-2,w:w+4,h:h+4});
    const gx=box.x+w/2,gy=box.y+h;
    if(!st.init){st.x=gx;st.y=gy;st.init=true}
    else{
      // 每帧最多移动 18px：避免槽位变化时标签瞬移，同时保持跟随手感
      const dx=gx-st.x,dy=gy-st.y,d=Math.hypot(dx,dy),cap=22;
      if(d>cap){st.x+=dx/d*cap;st.y+=dy/d*cap}
      else{st.x+=dx*smooth;st.y+=dy*smooth}
    }
    st.slot=bestIdx;
    tag.style.transform=`translate3d(${st.x.toFixed(1)}px,${st.y.toFixed(1)}px,0) translate(-50%,-100%)`;
  });
  td.R.render(td.S,c);
}

/* ---------- 示例：把示例照片做成一张斜放在桌上的拍立得，打开就能看到完整流程 ---------- */
function demo(){
  const im=new Image();im.onload=()=>{
    const F=FORMATS.mini,s=10,W=F.W*s,H=F.H*s;
    const film=document.createElement('canvas');film.width=W;film.height=H;const fx=film.getContext('2d');
    fx.fillStyle='#F6F5F0';fx.fillRect(0,0,W,H);
    const [ix,iy,iw,ih]=F.img.map(v=>v*s),k=Math.max(iw/im.width,ih/im.height);
    fx.save();fx.beginPath();fx.rect(ix,iy,iw,ih);fx.clip();fx.drawImage(im,ix+(iw-im.width*k)/2,iy+(ih-im.height*k)/2,im.width*k,im.height*k);fx.restore();
    const fd=fx.getImageData(0,0,W,H);
    const TW=900,TH=1200,table=document.createElement('canvas');table.width=TW;table.height=TH;const tx=table.getContext('2d');
    tx.fillStyle='#3B2F27';tx.fillRect(0,0,TW,TH);
    const td=tx.getImageData(0,0,TW,TH),q=[[250,220],[700,290],[640,1010],[170,930]];
    const h=solveH(q,[[0,0],[W,0],[W,H],[0,H]]);
    for(let y=150;y<1080;y++)for(let x=120;x<760;x++){const d=h[6]*x+h[7]*y+1,u=(h[0]*x+h[1]*y+h[2])/d,v=(h[3]*x+h[4]*y+h[5])/d;
      if(u<0||v<0||u>=W-1||v>=H-1)continue;const si=((v|0)*W+(u|0))*4,o=(y*TW+x)*4;td.data[o]=fd.data[si];td.data[o+1]=fd.data[si+1];td.data[o+2]=fd.data[si+2]}
    for(let i=0;i<td.data.length;i+=4){const n=(Math.random()-.5)*10;td.data[i]+=n;td.data[i+1]+=n;td.data[i+2]+=n}
    tx.putImageData(td,0,0);
    setSource(table);
    $('straighten').click();ed.demo=true;
    const st=ed.st;st.filter='旧夏';st.caption='帕兰加，晒到发烫';$('cap').textContent=st.caption;syncControls();layoutCard();renderCard();
    toast(DESK?'这是示例照片。把你的拍立得照片拖进窗口就能换，可以一次拖好几张。':'这是示例照片。点「‹ 重扫」再点「拍一张」，换成你自己的拍立得。',4200);
  };im.src=SAMPLE;
}
